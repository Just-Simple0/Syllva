<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Syllva</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header><h1>Syllva</h1><p id="status">연결하는 중…</p></header>
  <main id="app">
    <section id="upload-section"><h2>자료 추가</h2>
      <form id="upload-form"><input id="upload-file" type="file"><input id="upload-course" type="text" placeholder="과목 키(선택)">
        <button type="submit">추가</button></form></section>
    <section id="review-section"><h2>확인 필요</h2><ul id="review-list"></ul></section>
    <section id="library-section"><h2>라이브러리</h2><ul id="library-list"></ul></section>
    <section id="canvas-section"><h2>Canvas 연결</h2><p id="canvas-status"></p>
      <form id="canvas-form"><input id="canvas-origin" type="url" placeholder="https://canvas.example.ac.kr" autocomplete="off">
        <input id="canvas-token" type="password" placeholder="액세스 토큰" autocomplete="off" spellcheck="false">
        <button type="submit">연결</button></form>
      <div id="canvas-connected" hidden>
        <form id="canvas-hosts-form"><input id="canvas-hosts" type="text" placeholder="파일 호스트(쉼표로 구분, 선택)" autocomplete="off">
          <button type="submit">저장</button></form>
        <button id="canvas-sync" type="button">지금 동기화</button>
        <ul id="canvas-sync-status"></ul>
        <button id="canvas-load" type="button">Canvas 과목 불러오기</button>
        <button id="canvas-forget" type="button">연결 끊기</button>
        <ul id="canvas-courses"></ul>
        <p>LTI 강의자료는 자동으로 가져오지 않습니다. 필요한 파일은 직접 추가하세요.</p></div></section>
    <section id="activities-section"><h2>과제</h2><ul id="activity-list"></ul></section>
    <section id="material-section" hidden><h2 id="material-title"></h2><p id="material-meta"></p>
      <div id="material-actions"></div><ul id="evidence-list"></ul></section>
  </main>
</body>
</html>
