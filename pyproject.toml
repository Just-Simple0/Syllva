[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "syllva"
version = "0.1.3"
description = "Syllva — beta, model-agnostic, MCP-centered, local-first academic context and retrieval system"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Syllva" }]
keywords = ["mcp", "retrieval", "notion", "google-drive", "learning-system", "study"]

# Runtime dependencies are intentionally minimal. Provider SDKs live behind
# adapter boundaries (see src/syllva/adapters/*) and may be optional extras.
dependencies = [
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
drive = ["google-api-python-client>=2.0", "google-auth>=2.0"]
notion = ["notion-client>=3.1,<4"]
github = ["PyGithub>=2.0"]
mcp = ["mcp>=2.2,<3", "uvicorn>=0.30,<1"]
web = ["starlette>=0.37,<2", "uvicorn>=0.30,<1"]
remote-mcp-oidc = ["PyJWT[crypto]>=2.8,<3"]
remote-mcp-oauth = ["PyJWT[crypto]>=2.8,<3"]
pdf = ["pypdf>=4.0"]
keyring = ["keyring>=25.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.9",
    "PyJWT[crypto]>=2.8,<3",
    "cryptography>=42.0",
    "import-linter>=2.1,<3",
]

[project.scripts]
syllva = "syllva.cli.main:main"
uls = "syllva.cli.main:main"  # legacy alias

[tool.hatch.build.targets.wheel]
packages = ["src/syllva"]

[tool.hatch.build.targets.wheel.force-include]
"contracts" = "syllva/data/contracts"
"clients" = "syllva/data/clients"
"config.example.yaml" = "syllva/data/config.example.yaml"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast isolated unit tests",
    "contract: model-independent contract tests (release blockers)",
    "integration: adapter/integration tests using fakes",
    "e2e: client end-to-end tests (external runtime, usually manual)",
    "live: optional live smoke tests against real providers",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.mypy]
python_version = "3.11"
packages = ["syllva"]
mypy_path = "src"
strict = true

# v2 import-direction contracts (implementation spec §1.3, §13.5).
# Only direct imports are checked. `ignore_imports` is a RATCHET: it records the
# violations that existed when the contracts were introduced (R1b-1). Entries may
# only be removed; an entry that no longer matches fails the check, and a new
# violation not listed here fails the check. The lists must be empty by end of R1b.
# A PR that adds a violation AND the matching ignore entry is not caught by the
# tool; such additions must be rejected in review.
# Not yet expressible (packages do not exist): agents -/-> library/state,
# prompt -/-> state, core layers -/-> ui/agents/shell (spec §1.3). They are added
# when those packages are created (R2/R4). Rust-side spawn checks land with shell/ (R2).
[tool.importlinter]
root_package = "syllva"

[[tool.importlinter.contracts]]
id = "core-no-outer-or-legacy"
name = "Core modules do not import outer layers or legacy providers"
type = "forbidden"
source_modules = [
    "syllva.domain", "syllva.ingestion", "syllva.normalization", "syllva.enrichment",
    "syllva.retrieval", "syllva.state", "syllva.ephemeral", "syllva.library",
]
forbidden_modules = [
    "syllva.settings", "syllva.mcp", "syllva.cli", "syllva.study_notes",
    "syllva.adapters.notion", "syllva.adapters.drive", "syllva.adapters.llm",
]
allow_indirect_imports = true
ignore_imports = [
    "syllva.ingestion.discovery -> syllva.adapters.drive.worker",
    "syllva.retrieval.engine -> syllva.adapters.drive.base",
    "syllva.retrieval.engine -> syllva.adapters.drive.binding",
    "syllva.state.reader -> syllva.adapters.drive.binding",
    "syllva.enrichment._common -> syllva.adapters.llm.base",
    "syllva.enrichment.material -> syllva.adapters.llm.base",
    "syllva.enrichment.session -> syllva.adapters.llm.base",
    "syllva.enrichment.writer -> syllva.adapters.llm.base",
    "syllva.enrichment.writer -> syllva.adapters.notion.base",
    "syllva.retrieval._compat -> syllva.adapters.notion.base",
    "syllva.retrieval.engine -> syllva.adapters.notion.base",
    "syllva.retrieval.resolver -> syllva.adapters.notion.base",
]

[[tool.importlinter.contracts]]
id = "lower-layers-no-services"
name = "Domain, state and ephemeral do not import higher service layers"
type = "forbidden"
source_modules = ["syllva.domain", "syllva.state", "syllva.ephemeral"]
forbidden_modules = ["syllva.intake", "syllva.retrieval"]
allow_indirect_imports = true
ignore_imports = [
    "syllva.state.classification_state -> syllva.intake.classification.calendar",
    "syllva.state.sqlite -> syllva.intake.identity",
    "syllva.state.usage_range -> syllva.intake.usage_range",
]

[[tool.importlinter.contracts]]
id = "no-external-llm-adapter"
name = "v2 runtime does not use the external LLM adapter (S2/enrichment paths disabled)"
type = "forbidden"
source_modules = [
    "syllva.intake", "syllva.runtime", "syllva.cli", "syllva.worker", "syllva.settings",
    "syllva.mcp", "syllva.study_notes", "syllva.proposal", "syllva.orchestration",
    "syllva.config", "syllva.behavior",
]
forbidden_modules = ["syllva.adapters.llm"]
allow_indirect_imports = true
ignore_imports = [
    "syllva.cli.main -> syllva.adapters.llm.typesafe_choice",
    "syllva.intake.classification.s2 -> syllva.adapters.llm.typesafe_choice",
    "syllva.intake.worker -> syllva.adapters.llm.typesafe_choice",
    "syllva.runtime -> syllva.adapters.llm.typesafe_choice",
]

[[tool.importlinter.contracts]]
id = "v2-storage-clean"
name = "v2 storage (state.v2, library) has no legacy or upper-layer dependencies (no exceptions)"
type = "forbidden"
source_modules = ["syllva.state.v2", "syllva.library"]
forbidden_modules = [
    "syllva.adapters", "syllva.intake", "syllva.retrieval", "syllva.settings", "syllva.mcp",
    "syllva.cli", "syllva.study_notes", "syllva.runtime", "syllva.worker", "syllva.enrichment",
    "syllva.ingestion", "syllva.normalization", "syllva.proposal", "syllva.orchestration",
]

[[tool.importlinter.contracts]]
id = "library-below-state"
name = "library does not import state (state.v2.database composes library, not the reverse)"
type = "forbidden"
source_modules = ["syllva.library"]
forbidden_modules = ["syllva.state"]

[[tool.importlinter.contracts]]
id = "v2-no-legacy"
name = "v2 modules never import code scheduled for deletion in R1c (no exceptions)"
type = "forbidden"
source_modules = [
    "syllva.state.v2", "syllva.library",
    "syllva.ingestion.local", "syllva.normalization.local", "syllva.normalization.chunks",
    "syllva.retrieval.natural", "syllva.retrieval.ranking", "syllva.retrieval.service",
    "syllva.domain.source_ref",
]
forbidden_modules = [
    "syllva.adapters.notion", "syllva.adapters.drive", "syllva.study_notes", "syllva.domain.approval_identity",
    "syllva.retrieval.engine", "syllva.retrieval.resolver", "syllva.retrieval._compat", "syllva.retrieval.chunking",
    "syllva.state.sqlite", "syllva.state.reader", "syllva.state.base", "syllva.state.models",
    "syllva.state.classification_state", "syllva.state.usage_range", "syllva.proposal",
    "syllva.enrichment.writer", "syllva.adapters.llm", "syllva.config.google_oauth",
    # outer layers: v2 core composes upward, never imports them
    "syllva.intake", "syllva.settings", "syllva.cli", "syllva.mcp", "syllva.runtime", "syllva.worker",
]
allow_indirect_imports = false

[[tool.importlinter.contracts]]
id = "v2-intake-clean"
name = "v2 intake reuses only the pure classifier, never the legacy worker or providers (no exceptions)"
type = "forbidden"
source_modules = ["syllva.intake.v2"]
forbidden_modules = [
    "syllva.intake.worker", "syllva.intake.composition", "syllva.intake.coordinator", "syllva.intake.registry",
    "syllva.intake.planner", "syllva.intake.requests", "syllva.intake.attestation", "syllva.intake.usage_range",
    "syllva.intake.study_note_composition", "syllva.intake.canvas_attachments", "syllva.intake.canvas_observer",
    "syllva.intake.canvas_composition", "syllva.intake.classification.s2",
    "syllva.adapters", "syllva.study_notes", "syllva.settings", "syllva.mcp", "syllva.cli", "syllva.proposal",
    "syllva.retrieval.engine", "syllva.retrieval.chunking", "syllva.state.sqlite", "syllva.state.reader",
    "syllva.domain.approval_identity", "syllva.enrichment",
]
allow_indirect_imports = false

[[tool.importlinter.contracts]]
id = "v2-retrieval-clean"
name = "v2 retrieval modules do not depend on legacy providers or the v1.2 engine (no exceptions)"
type = "forbidden"
source_modules = ["syllva.retrieval.natural", "syllva.retrieval.ranking", "syllva.retrieval.service"]
forbidden_modules = [
    "syllva.adapters", "syllva.settings", "syllva.mcp", "syllva.cli", "syllva.study_notes", "syllva.intake",
    "syllva.retrieval.engine", "syllva.retrieval.resolver", "syllva.retrieval._compat",
    # C-02: the retrieval path never reaches the write side
    "syllva.state.v2.writer", "syllva.state.v2.database",
]
allow_indirect_imports = false
