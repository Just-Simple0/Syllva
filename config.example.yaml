#   REMOTE_MCP_SECRET:
#     source: file
#
#   # Interactive CLI & MCP tools (OS keyring-backed)
#   NOTION_MCP_TOKEN:
#     source: keyring
#   GITHUB_READ_TOKEN:
#     source: keyring
#   LLM_API_KEY:
#     source: keyring
#   REMOTE_MCP_GOOGLE_CLIENT_SECRET:
#     source: keyring
