# University Learning System — example configuration (spec §5)
# Copy to config.yaml. Secrets come from the process environment, never here.
# The CLI does not automatically load .env files.

system:
  timezone: Asia/Seoul
  workspace_dir: ~/.uls
  state_backend: sqlite
  ephemeral_backend: memory

worker:
  enabled: true
  poll_interval_minutes: 1

storage:
  normalized_derivatives: google_drive

google_drive:
  university_root_id: "..."
  # Legacy global inbox (v1.2 reader only). Not used when semester_registries is active.
  inbox_root_id: "..."

  # v1.3 preview — semester-scoped intake. Remove or leave empty to use legacy reader only.
  semester_registries:
    - semester: "2026-2"
      # Top-level semester folder in Drive.
      folder_id: "<semester-folder-id>"
      # Single shared upload folder where you drop new files.
      upload_folder_id: "<upload-folder-id>"
      # Map from course_key → course root folder ID.
      course_folder_ids:
        "2026-2_COURSE001-001": "<course-folder-id>"
      # Per-course static sub-folders (created once at semester setup).
      course_static_folder_ids:
        "2026-2_COURSE001-001":
          recordings_folder_id: "<recordings-folder-id>"
          materials_folder_id: "<materials-folder-id>"
      # Optional per-course upload overrides. Leave empty to use the shared upload folder.
      optional_course_upload_folder_ids: {}

notion:
  # Legacy global database IDs (v1.2 custom ULS MCP reader — read-only retrieval surface).
  courses_db_id: "..."
  sessions_db_id: "..."
  materials_db_id: "..."
  material_usage_db_id: "..."
  activities_db_id: "..."
  exams_db_id: "..."
  automation_queue_db_id: "..."

  # v1.3 preview — semester-scoped native Notion workspaces.
  # Each semester needs exactly 5 native data sources provisioned in Notion.
  semester_workspaces:
    - semester: "2026-2"
      # Parent page ID under which the 5 data sources live.
      connection_settings_files_parent_id: "<notion-parent-page-id>"
      academic_courses_data_source_id: "<courses-db-id>"
      sessions_data_source_id: "<sessions-db-id>"
      materials_data_source_id: "<materials-db-id>"
      file_intake_data_source_id: "<file-intake-db-id>"
      input_requests_data_source_id: "<input-requests-db-id>"
      # Optional v1.3 retrieval evidence; absence keeps Session retrieval transcript-only.
      # material_usage_data_source_id: "<material-usage-data-source-id>"
      # Map from course_key → Notion portal page ID (dashboard page per course).
      portal_page_ids:
        "2026-2_COURSE001-001": "<course-portal-page-id>"

normalization:
  schema_version: v1
  processor_version: "1.2.0"
  goodnotes_visual_fallback: true

retrieval:
  notion_lane: legacy_global  # v1.2 default; use semester_workspace only by explicit opt-in
  semester: ""                # required exact semester only for semester_workspace
  concept_mode: bounded_lexical
  max_candidate_entities: 20
  max_candidate_chunks: 12
  context_ttl_seconds: 900
  resolution_ttl_seconds: 900
  allow_bounded_llm_rerank: false  # opt-in; deterministic lexical/index retrieval is default
  allow_provisional_material_usage: true  # caller must still opt in per request
  material_type_source_class:
    "Lecture Slides": professor_material
    "Professor Notes": professor_material
    "Syllabus": professor_material
    "Textbook": supplemental_reference
    "Reference": supplemental_reference
    "Supplementary": supplemental_reference
  max_evidence_items: 12
  max_chars_per_item: 4000
  max_total_chars: 24000
  max_followup_chunks: 8

mcp:
  mode: local
  read_only: true

study_notes:
  enabled: false  # Separate AI-draft submission service; search stays read-only.
  local_caller_id: uls-local-study-notes
  template_version: study-note.v1
  generator_config_version: mcp-client-draft.v1
  grant_ttl_seconds: 1800
  max_draft_chars: 100000

remote_mcp:
  enabled: false
  auth_mode: oauth_or_bearer  # "oauth_or_bearer" | "oidc" | "bearer" | "mcp_oauth"
  edge_mode: direct_tls  # "direct_tls" | "cloudflare_tunnel" (mcp_oauth only)
  public_unauthenticated: false
  # public_url: https://uls.example/mcp
  # host: 127.0.0.1
  # port: 8765
  # tls_certfile: /path/to/fullchain.pem
  # tls_keyfile: /path/to/privkey.pem
  # oidc:
  #   issuer: "https://accounts.google.com"
  #   audience: "your-client-id.apps.googleusercontent.com"
  #   authorized_subject: "your-sub-id"
  #   authorized_email: "your-email@example.com"
  # oauth:  # used only by auth_mode: mcp_oauth
  #   google_client_id: "your-google-web-client.apps.googleusercontent.com"
  #   authorized_email: "owner@example.com"
  #   access_token_ttl_seconds: 900
  #   refresh_token_ttl_seconds: 2592000
  #   authorization_ttl_seconds: 600

behavior_contract:
  version: 2
  path: contracts/study-behavior.md

courses:
  # Add one entry per course. course_key must match keys in semester_registries and semester_workspaces.
  - course_key: "2026-2_COURSE001-001"
    name: "예시 과목명"
    code: "COURSE001"
    section: "001"
    semester: "2026-2"
  # - course_key: "2026-2_COURSE002-001"
  #   name: "두 번째 과목"
  #   code: "COURSE002"
  #   section: "001"
  #   semester: "2026-2"

# The KNU/Canvas LMS sidecar (scripts/knu_lms_probe.py, scripts/knu_lms_sync.py)
# is a separately gated, standalone script suite. It has no top-level key in
# this file and reads no setting from config.yaml; it keeps its own runtime
# config/manifest under .review/knu-lms-hourly/. See
# docs/operator-guide/lms-sync.md for its credential model and safety rules.
# It stays paused by default and is never activated merely by editing config.yaml.

