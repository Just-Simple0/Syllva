name: ULS contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev,mcp,drive,notion,pdf,web]"
      - run: python -m pytest -q -ra
      - name: Windows secure-file regressions
        if: ${{ (success() || failure()) && runner.os == 'Windows' }}
        run: python -m pytest -q -ra tests/unit/test_secure_file.py
      - run: python scripts/lint_behavior_projection.py
      - name: v2 import-direction contracts (ratchet, implementation spec §1.3)
        if: ${{ success() || failure() }}
        run: lint-imports
      - name: v2 static invariants (ratchet, implementation spec §13.5)
        if: ${{ success() || failure() }}
        run: python scripts/check_invariants.py
      - run: python -m compileall -q src
  v2:
    # v2 contract/unit subset on every OS (design §11 C-16). The legacy suite above
    # keeps its known Windows failures; this job must stay green everywhere.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix tests/ui --no-audit --no-fund  # C-18 DOM harness (jsdom), never skipped in CI
      - run: python -m pip install -e ".[dev,pdf,web]"
      - run: python -m pytest -q -ra tests/contract/v2 tests/unit/test_v2_library_blobs.py tests/unit/test_v2_library_paths.py tests/unit/test_v2_state_migrate.py tests/unit/test_v2_resolver_cues.py tests/unit/test_v2_cli.py
      - run: lint-imports
      - run: python scripts/check_invariants.py
