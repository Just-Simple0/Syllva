name: ULS contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix tests/ui --no-audit --no-fund  # the full suite includes the C-18 DOM harness
      - run: python -m pip install -e ".[dev,mcp,drive,notion,pdf,web]"
      - run: python -m pytest -q -ra
      - name: Windows secure-file regressions
        if: ${{ (success() || failure()) && runner.os == 'Windows' }}
        run: python -m pytest -q -ra tests/unit/test_secure_file.py
      - run: python scripts/lint_behavior_projection.py
      - name: v2 import-direction contracts (ratchet, implementation spec §1.3)
        if: ${{ success() || failure() }}
        run: lint-imports
      - name: v2 static invariants (ratchet, implementation spec §13.5)
        if: ${{ success() || failure() }}
        run: python scripts/check_invariants.py
      - run: python -m compileall -q src
  v2:
    # v2 contract/unit subset on every OS (design §11 C-16). The legacy suite above
    # keeps its known Windows failures; this job must stay green everywhere.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix tests/ui --no-audit --no-fund  # C-18 DOM harness (jsdom), never skipped in CI
      - run: python -m pip install -e ".[dev,pdf,web]"
      - run: python -m pytest -q -ra tests/contract/v2 tests/unit/test_v2_library_blobs.py tests/unit/test_v2_library_paths.py tests/unit/test_v2_state_migrate.py tests/unit/test_v2_resolver_cues.py tests/unit/test_v2_cli.py tests/unit/test_v2_core_selfcheck.py
      - run: lint-imports
      - run: python scripts/check_invariants.py

  shell:
    # Rust shell (R2-4): the pure protocol crate is tested on every OS; the Tauri app is
    # linted and built (it needs the platform webview SDK; webkit2gtk on Linux).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: shell
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libsoup-3.0-dev librsvg2-dev libgtk-3-dev
      - run: rustup component add clippy
      - run: cargo test -p syllva-shell-proto
      - run: cargo test -p syllva-shell  # fake-Core start/watchdog tests (a short Python script plays the Core: needs python3/python on the runner)
      - run: cargo clippy -p syllva-shell-proto -p syllva-shell --all-targets -- -D warnings
      - run: cargo build -p syllva-shell


  bundle:
    # R2-5 bundle spike (implementation spec §13.6): the Core as a PyInstaller onedir sidecar,
    # smoke-tested as the Shell drives it. Signing/notarization is a separate (user) decision.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install ".[pdf,web,keyring,bundle]"
      - run: pyinstaller --noconfirm --clean --log-level WARN --distpath ../dist --workpath ../build syllva-core.spec
        working-directory: packaging
      - if: runner.os != 'Windows'
        run: python scripts/smoke_core_bundle.py dist/syllva-core/syllva-core
      - if: runner.os == 'Windows'
        run: python scripts/smoke_core_bundle.py dist/syllva-core/syllva-core.exe
