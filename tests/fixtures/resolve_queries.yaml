  - {q: "Chapter 04", expect: resolved, entity: [material, M-N1]}
  - {q: "ch4 정리해줘", expect: resolved, entity: [material, M-N1]}
  - {q: "네트워크프로그래밍 4주차", expect: resolved, entity: [session, LMS67536-S04]}
  - {q: "Network Programming week 3", expect: resolved, entity: [session, LMS67536-S03]}
