# C-14 resolve query fixture (implementation spec §9.3, design §7.2).
# Catalog modelled on the 2026-2 midterm usage (handoff 2026-10-14): course names
# with digits and Korean/English aliases, LMS calendar one week ahead of file-name
# weeks for 알고리즘2, chapter-numbered slides, transcripts and a past exam.
semester_starts:
  "2026-2": "2026-09-01"
catalog:
  courses:
    - {key: LMS67535, name: 알고리즘2, code: COMP0217, aliases: ["Algorithms 2", "알고리즘 2"]}
    - {key: LMS67536, name: 네트워크프로그래밍, aliases: ["네프", "Network Programming"]}
    - {key: LMS67537, name: 데이타베이스, aliases: ["데이터베이스", "DB"]}
    # a course whose name is a prefix of another, and a short Latin alias (review of PR #41)
    - {key: LMS1, name: 알고리즘}
    - {key: LMS2, name: 운영체제, aliases: ["OS"]}
  sessions:
    # 알고리즘2 starts in calendar week 2: session N is calendar week N+1
    - {id: LMS67535-S01, course: LMS67535, number: 1, held_on: "2026-09-10"}
    - {id: LMS67535-S02, course: LMS67535, number: 2, held_on: "2026-09-17"}
    - {id: LMS67535-S03, course: LMS67535, number: 3, held_on: "2026-09-24"}
    - {id: LMS67536-S01, course: LMS67536, number: 1, held_on: "2026-09-02"}
    - {id: LMS67536-S02, course: LMS67536, number: 2, held_on: "2026-09-09"}
    - {id: LMS67536-S03, course: LMS67536, number: 3, held_on: "2026-09-16"}
    - {id: LMS67536-S04, course: LMS67536, number: 4, held_on: "2026-09-23"}
    - {id: LMS67537-S01, course: LMS67537, number: 1, held_on: "2026-09-04"}
    - {id: LMS1-S01, course: LMS1, number: 1, held_on: "2026-09-07"}
    - {id: LMS1-S02, course: LMS1, number: 2, held_on: "2026-09-14"}
  materials:
    - {id: M-A1, course: LMS67535, title: 알고리즘2_중간고사_기출문제지.pdf, kind: EXAM}
    - {id: M-N1, course: LMS67536, session: LMS67536-S04, title: Chapter 04_05 TCP 소켓 프로그래밍.pdf, kind: LECTURE_SLIDES}
    - {id: M-N2, course: LMS67536, title: Chapter 03 UDP.pdf, kind: LECTURE_SLIDES}
    - {id: M-N3, course: LMS67536, session: LMS67536-S02, title: S02 전사문.txt, kind: TRANSCRIPT}
queries:
  # expect: resolved -> entity [type, id]; ambiguous -> candidate ids (set); none
