[package]
name = "syllva-shell-proto"
description = "Shell side of the Syllva Core protocol: JSONL framing, gate MAC, spawn env, relay log (spec §2, §6.3.2)."
edition.workspace = true
license.workspace = true
version.workspace = true
publish = false

[dependencies]
base64 = "0.22"
getrandom = "0.2"
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
